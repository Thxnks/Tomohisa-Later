<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>保存 Information Debt</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main>
			<header>
				<h1>保存为 Information Debt</h1>
				<button id="open-options" class="link-button" type="button">设置</button>
			</header>

			<label for="title">标题</label>
			<input id="title" type="text" maxlength="512" readonly />

			<label for="url">URL</label>
			<input id="url" type="url" readonly />

			<label for="why-saved">为什么保存</label>
			<textarea id="why-saved" maxlength="4000" rows="5" autofocus required></textarea>

			<button id="save" class="primary" type="button">保存</button>
			<p id="status" role="status" aria-live="polite"></p>
		</main>
		<script src="popup.js"></script>
	</body>
</html>
